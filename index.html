<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRIS Magang Komnas Perempuan</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #eef2f5; padding: 20px 0; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); width: 380px; text-align: center; }
    h2, h3, h4 { margin-top: 0; color: #2c3e50; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    button { background: #2563eb; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin-top: 6px; }
    button:hover { background: #1d4ed8; }
    .btn-pulang { background: #ef4444; }
    .btn-pulang:hover { background: #dc2626; }
    .btn-secondary { background: #10b981; }
    .btn-warning { background: #f59e0b; }
    .hidden { display: none; }
    #status { margin-top: 12px; font-size: 12px; word-break: break-word; }
    .profile-img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #2563eb; display: block; margin: 0 auto 10px; }
    .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
    .nav-tabs button { padding: 6px; font-size: 11px; margin: 0; background: #e2e8f0; color: #334155; }
    .nav-tabs button.active { background: #2563eb; color: white; }
    .list-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 11px; text-align: left; }
  </style>
</head>
<body>

  <div class="card">
    <h2>HRIS Magang</h2>

    <!-- FORM AUTENTIKASI -->
    <div id="authSection">
      <input type="email" id="email" placeholder="Email Karyawan">
      <input type="password" id="password" placeholder="Password (Min. 6 Karakter)">
      <button type="button" onclick="login()">Masuk</button>
      <button type="button" class="btn-secondary" onclick="register()">Daftar Akun Baru</button>
    </div>

    <!-- DASHBOARD UTAMA -->
    <div id="mainDashboard" class="hidden">
      <img id="userAvatar" class="profile-img" src="https://via.placeholder.com/75?text=Foto" alt="Profile">
      <h4 id="userName" style="margin-bottom:12px;">Pengguna</h4>

      <!-- TAB NAVIGASI -->
      <div class="nav-tabs">
        <button id="tabAbsenBtn" class="active" onclick="switchTab('absen')">Presensi</button>
        <button id="tabIzinBtn" onclick="switchTab('izin')">Izin/Shift</button>
        <button id="tabRekanBtn" onclick="switchTab('rekan')">Rekan</button>
        <button id="tabProfilBtn" onclick="switchTab('profil')">Profil</button>
      </div>

      <!-- TAB 1: PRESENSI -->
      <div id="tabAbsen">
        <button id="btnMasuk" onclick="catatPresensi('Masuk')">Absen Masuk via GPS</button>
        <button id="btnPulang" class="btn-pulang" onclick="catatPresensi('Pulang')">Absen Pulang via GPS</button>
        
        <h4 style="margin-top:15px; margin-bottom:6px;">Riwayat Saya</h4>
        <div id="riwayatList" style="max-height:150px; overflow-y:auto;"></div>
      </div>

      <!-- TAB 2: IZIN / TUKAR SHIFT -->
      <div id="tabIzin" class="hidden">
        <select id="reqType">
          <option value="izin">Pengajuan Izin</option>
          <option value="tukar_shift">Perubahan / Tukar Shift</option>
        </select>
        <textarea id="reqDesc" placeholder="Alasan pengajuan..." rows="3"></textarea>
        <button class="btn-warning" onclick="kirimPengajuan()">Kirim Pengajuan</button>
      </div>

      <!-- TAB 3: DIREKTORI REKAN -->
      <div id="tabRekan" class="hidden">
        <h4>Daftar Rekan Magang</h4>
        <div id="rekanList" style="max-height:220px; overflow-y:auto;"></div>
      </div>

      <!-- TAB 4: PROFIL & FOTO -->
      <div id="tabProfil" class="hidden">
        <input type="text" id="editFullName" placeholder="Nama Lengkap Kamu">
        <label style="font-size:11px; display:block; text-align:left; margin-top:6px;">Pilih Foto Profil:</label>
        <input type="file" id="avatarFile" accept="image/*">
        <button onclick="simpanProfil()">Simpan Profil</button>
        <button class="btn-pulang" onclick="logout()">Keluar / Logout</button>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://dreztgddckcxpjsrjdpg.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyZXp0Z2RkY2tjeHBqc3JqZHBnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDIxMzI5OCwiZXhwIjoyMTA1Nzg5Mjk4fQ.roOROpGyQQ8v18XUl7oXxz2CII86oe_oyc-wD6f-Cto";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userProfile = null;

    async function checkAuth() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        currentUser = user;
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('mainDashboard').classList.remove('hidden');
        await muatProfil();
        muatRiwayat();
      }
    }
    checkAuth();

    async function register() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');
      if (!email || !password) return status.innerHTML = "<span style='color:red'>Lengkapi data!</span>";
      
      status.innerText = "Mendaftarkan...";
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) status.innerHTML = `<span style='color:red'>${error.message}</span>`;
      else status.innerHTML = "<span style='color:green'>Akun dibuat! Silakan klik Masuk.</span>";
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');
      status.innerText = "Memverifikasi...";
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) status.innerHTML = `<span style='color:red'>${error.message}</span>`;
      else location.reload();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    function switchTab(tabName) {
      ['absen', 'izin', 'rekan', 'profil'].forEach(t => {
        document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('hidden');
        document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn').classList.remove('active');
      });
      document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.remove('hidden');
      document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1) + 'Btn').classList.add('active');

      if (tabName === 'rekan') muatRekan();
    }

    // --- FITUR PRESENSI (MASUK & PULANG) ---
    function catatPresensi(tipeAbsen) {
      const statusDiv = document.getElementById('status');
      if (!navigator.geolocation) return statusDiv.innerHTML = "<span style='color:red'>GPS tidak didukung.</span>";

      statusDiv.innerText = `Mengambil lokasi untuk Absen ${tipeAbsen}...`;
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const jam = new Date().toTimeString().split(' ')[0];

        let alamatTeks = "Lokasi GPS Terdeteksi";
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
          const geoData = await res.json();
          if(geoData.display_name) alamatTeks = geoData.display_name;
        } catch (e) { console.log("Geocoding Error:", e); }

        const { error } = await supabaseClient
          .from('attendances')
          .insert([{ 
            user_id: currentUser.id, 
            jam_masuk: jam, 
            latitude: lat, 
            longitude: lng, 
            alamat: alamatTeks, 
            tipe: tipeAbsen,
            status: 'Hadir' 
          }]);

        if (error) statusDiv.innerHTML = `<span style='color:red'>${error.message}</span>`;
        else {
          statusDiv.innerHTML = `<span style='color:green'><b>Absen ${tipeAbsen} Berhasil!</b><br>📍 ${alamatTeks}</span>`;
          muatRiwayat();
        }
      }, (err) => statusDiv.innerHTML = `<span style='color:red'>Akses GPS Ditolak! Pastikan GPS aktif.</span>`, { enableHighAccuracy: true });
    }

    async function muatRiwayat() {
      const { data } = await supabaseClient
        .from('attendances')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      const list = document.getElementById('riwayatList');
      if (data && data.length > 0) {
        list.innerHTML = data.map(item => `
          <div class="list-item">
            <b>Absen ${item.tipe || 'Masuk'}</b> (${item.jam_masuk})<br>
            <small>📍 ${item.alamat || (item.latitude + ', ' + item.longitude)}</small>
          </div>
        `).join('');
      } else {
        list.innerHTML = "<small style='color:#64748b;'>Belum ada riwayat presensi.</small>";
      }
    }

    // --- PROFIL & UPLOAD FOTO ---
    async function muatProfil() {
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      if (data) {
        userProfile = data;
        document.getElementById('userName').innerText = data.full_name || currentUser.email;
        if (data.avatar_url) document.getElementById('userAvatar').src = data.avatar_url;
        document.getElementById('editFullName').value = data.full_name || '';
      }
    }

    async function simpanProfil() {
      const fullName = document.getElementById('editFullName').value;
      const avatarFile = document.getElementById('avatarFile').files[0];
      const status = document.getElementById('status');
      status.innerText = "Menyimpan profil...";

      let avatarUrl = userProfile?.avatar_url || '';

      if (avatarFile) {
        const fileExt = avatarFile.name.split('.').pop();
        const filePath = `${currentUser.id}_${Date.now()}.${fileExt}`;
        const { error: uploadErr } = await supabaseClient.storage.from('profiles').upload(filePath, avatarFile, { upsert: true });
        if (!uploadErr) {
          const { data: urlData } = supabaseClient.storage.from('profiles').getPublicUrl(filePath);
          avatarUrl = urlData.publicUrl;
        } else {
          console.log("Upload error:", uploadErr);
        }
      }

      const { error } = await supabaseClient.from('profiles').upsert({
        id: currentUser.id,
        full_name: fullName,
        avatar_url: avatarUrl
      });

      if (error) status.innerHTML = `<span style='color:red'>${error.message}</span>`;
      else {
        status.innerHTML = "<span style='color:green'>Profil berhasil diperbarui!</span>";
        await muatProfil();
      }
    }

    // --- FITUR IZIN ---
    async function kirimPengajuan() {
      const type = document.getElementById('reqType').value;
      const desc = document.getElementById('reqDesc').value;
      const status = document.getElementById('status');

      if (!desc) return status.innerHTML = "<span style='color:red'>Alasan wajib diisi!</span>";

      const { error } = await supabaseClient.from('requests').insert([{ user_id: currentUser.id, type, description: desc }]);
      if (error) status.innerHTML = `<span style='color:red'>${error.message}</span>`;
      else {
        status.innerHTML = "<span style='color:green'>Pengajuan berhasil dikirim!</span>";
        document.getElementById('reqDesc').value = "";
      }
    }

    // --- FITUR DIREKTORI REKAN ---
    async function muatRekan() {
      const { data } = await supabaseClient.from('profiles').select('*');
      const list = document.getElementById('rekanList');
      if (data && data.length > 0) {
        list.innerHTML = data.map(r => `
          <div class="list-item" style="display:flex; align-items:center; gap:10px;">
            <img src="${r.avatar_url || 'https://via.placeholder.com/35?text=Foto'}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
            <div>
              <b>${r.full_name || 'Anak Magang'}</b>
            </div>
          </div>
        `).join('');
      } else {
        list.innerHTML = "<small style='color:#64748b;'>Belum ada profil rekan lain yang tersimpan.</small>";
      }
    }
  </script>
</body>
</html>
