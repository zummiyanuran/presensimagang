<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRIS Presensi Lokasi</title>
  <!-- Menggunakan Supabase JS v2 versi bundle resmi yang kompatibel -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #eef2f5; }
    .card { background: white; padding: 28px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); width: 350px; text-align: center; }
    h2 { margin-top: 0; color: #2c3e50; }
    input { width: 100%; padding: 10px 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 8px; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .btn-secondary { background: #10b981; }
    .btn-secondary:hover { background: #059669; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .hidden { display: none; }
    #status { margin-top: 15px; font-size: 13px; word-break: break-word; }
    .info-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>HRIS Presensi</h2>

    <!-- FORM AUTENTIKASI (LOGIN / REGISTRASI) -->
    <div id="authSection">
      <div class="info-box">
        <small>Silakan masuk atau daftarkan akun baru Anda.</small>
      </div>
      <input type="email" id="email" placeholder="Email Karyawan">
      <input type="password" id="password" placeholder="Password (Min. 6 Karakter)">
      <button type="button" onclick="login()">Masuk</button>
      <button type="button" class="btn-secondary" onclick="register()">Daftar Akun Baru</button>
    </div>

    <!-- DASHBOARD PRESENSI LOKASI -->
    <div id="presensiSection" class="hidden">
      <div class="info-box">
        <span>Pengguna:</span><br>
        <b id="userEmail"></b>
      </div>
      <button id="btnAbsen" type="button" onclick="catatPresensi()">Absen Masuk via GPS</button>
      <button type="button" class="btn-danger" onclick="logout()">Keluar / Logout</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // Konfigurasi Supabase
    const SUPABASE_URL = "https://dreztgddckcxpjsrjdpg.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyZXp0Z2RkY2tjeHBqc3JqZHBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTMyOTgsImV4cCI6MjEwNTc4OTI5OH0.AbmHvnFfEwuqPhkf_9UXroFOKn9W0ZLDtFEZ6hGMMRY";

    let supabaseClient;
    
    // Inisialisasi Klien Supabase dengan Error Catching
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
      console.error("Gagal inisialisasi Supabase:", e);
      document.getElementById('status').innerHTML = `<span style="color:red">Error Konfigurasi Supabase: ${e.message}</span>`;
    }

    // 1. Cek Sesi Login Karyawan
    async function checkAuth() {
      if (!supabaseClient) return;
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          document.getElementById('authSection').classList.add('hidden');
          document.getElementById('presensiSection').classList.remove('hidden');
          document.getElementById('userEmail').innerText = user.email;
        }
      } catch (err) {
        console.log("Belum login:", err);
      }
    }
    checkAuth();

    // 2. Fungsi Registrasi Akun Baru
    async function register() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');

      if (!email || !password) {
        status.innerHTML = `<span style="color:red">Email dan Password wajib diisi!</span>`;
        return;
      }

      if (password.length < 6) {
        status.innerHTML = `<span style="color:red">Password minimal 6 karakter!</span>`;
        return;
      }

      status.innerText = "Mendaftarkan akun...";
      try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });

        if (error) {
          status.innerHTML = `<span style="color:red">Gagal Daftar: ${error.message}</span>`;
        } else {
          status.innerHTML = `<span style="color:green">Akun berhasil dibuat! Silakan klik tombol <b>Masuk</b>.</span>`;
        }
      } catch (err) {
        status.innerHTML = `<span style="color:red">Error: ${err.message}</span>`;
      }
    }

    // 3. Fungsi Login
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');

      if (!email || !password) {
        status.innerHTML = `<span style="color:red">Email dan Password wajib diisi!</span>`;
        return;
      }

      status.innerText = "Memverifikasi akun...";
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          status.innerHTML = `<span style="color:red">Login Gagal: ${error.message}</span>`;
        } else {
          location.reload();
        }
      } catch (err) {
        status.innerHTML = `<span style="color:red">Error: ${err.message}</span>`;
      }
    }

    // 4. Fungsi Logout
    async function logout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      location.reload();
    }

    // 5. Presensi Berbasis Lokasi (GPS)
    function catatPresensi() {
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('btnAbsen');

      if (!navigator.geolocation) {
        statusDiv.innerHTML = "<span style='color:red;'>Browser Anda tidak mendukung Geolocation GPS.</span>";
        return;
      }

      btn.disabled = true;
      statusDiv.innerText = "Mengambil koordinat lokasi GPS Anda...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const jam = new Date().toTimeString().split(' ')[0];
          
          try {
            const { data: { user } } = await supabaseClient.auth.getUser();

            statusDiv.innerText = "Menyimpan data presensi...";

            const { error } = await supabaseClient
              .from('attendances')
              .insert([{ user_id: user.id, jam_masuk: jam, latitude: lat, longitude: lng, status: 'Hadir' }]);

            if (error) {
              statusDiv.innerHTML = `<span style='color:red;'>Gagal menyimpan: ${error.message}</span>`;
            } else {
              statusDiv.innerHTML = `<span style='color:green;'><b>Presensi Berhasil!</b><br>Jam: ${jam}<br>Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}</span>`;
            }
          } catch (err) {
            statusDiv.innerHTML = `<span style='color:red;'>Error Presensi: ${err.message}</span>`;
          }
          btn.disabled = false;
        },
        (err) => {
          statusDiv.innerHTML = `<span style='color:red;'>Akses Lokasi Ditolak/Gagal: ${err.message}. Pastikan GPS aktif.</span>`;
          btn.disabled = false;
        },
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
